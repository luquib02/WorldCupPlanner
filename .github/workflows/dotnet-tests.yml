name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_PATH: "WorldCupPlanner.sln"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Run build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Run Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release

      - name: Generate Test Results
        run: >
          dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFilePrefix=test-results"
          --results-directory ./coverage

      - name: Uploaded Test Results
        if: ${{ always() }}
        uses: dorny/test-reporter@v1
        with:
          name: Uploaded Test Results
          path: "**/coverage/*.trx"
          reporter: dotnet-trx
          path-replace-backslashes: false
          list-suites: all
          list-tests: all
          max-annotations: 10
          fail-on-error: true
          fail-on-empty: true
          only-summary: false

      - name: Generate Test Coverage
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          dotnet tool install --global dotnet-coverage || dotnet tool update --global dotnet-coverage
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p raw-coverage
          dotnet-coverage collect -f cobertura -o ./raw-coverage/coverage.cobertura.xml --settings .runsettings \
            "dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal"

      - name: Join Coverage Reports
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.9
        with:
          reports: raw-coverage/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: Cobertura

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/*.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "85 90"

      - name: Add Coverage PR Comment
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Write to Job Summary
        if: ${{ always() }}
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Build Tag
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch --tags origin
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          GIT_TAGS=$(git tag | egrep '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || true)
          if [ -z "$GIT_TAGS" ]; then
            LATEST="0.0.0"
          else
            LATEST=$(
              git tag --list |
              egrep '^[0-9]+\.[0-9]+(\.[0-9]+)?$' |
              sort -V |
              tail -n 1
            )
          fi
          if echo "$LATEST" | egrep '^[0-9]+\.[0-9]+$'; then
            BUMPED="${LATEST}.0"
          else
            BUMPED=$(echo $LATEST | awk -F. '{ print $1 "." $2 "." ($3 + 1) }')
          fi
          echo "bumping ${LATEST} to ${BUMPED}"
          git tag --annotate "$BUMPED" --message "via GitHub Actions"
          git push origin "$BUMPED"
